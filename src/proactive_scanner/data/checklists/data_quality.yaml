# 数据质量检查清单
name: "数据质量检查"
description: "检查新修改/生成内容中的数据完整性和准确性"
weight: 10  # 优先级最高

checks:
  - id: undefined_numbers
    name: "未定义口径的数字"
    prompt: >
      扫描提供的内容，找出所有数字/百分比/统计数据（如"增长30%"、"5倍"、"10000用户"），
      判断每个数字是否有明确的定义口径（基准是什么？统计范围？时间范围？）。
      如果有数字未说明口径，列出它。
    severity: error
    weight: 9

  - id: data_source_validity
    name: "数据来源有效性"
    prompt: >
      检查内容中引用的外部数据来源（链接、引用、数据集名称）。判断：
      1. 来源名称是否可追溯到具体机构/报告
      2. 链接是否真实存在（如果有链接）
      3. 数据是否来自权威渠道
      列出不明确或可疑的数据来源。
    severity: warning
    weight: 7

  - id: data_conflict
    name: "数据冲突检测"
    prompt: >
      将新内容与已有内容（同一项目的其他文件/段落）对比。
      检查同一指标在不同位置是否有不同的数值。
      例如：同一个增长率在不同段落里数字不一致。
      列出所有冲突。
    severity: error
    weight: 10

  - id: undefined_terms
    name: "未定义的术语/缩写"
    prompt: >
      扫描内容中的专业术语、英文缩写、行业黑话。
      判断这些术语是否已经被定义过（在前文中或术语表中）。
      列出首次出现但未定义的术语。
    severity: warning
    weight: 5
