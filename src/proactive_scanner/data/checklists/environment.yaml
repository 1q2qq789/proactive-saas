# 环境健康检查清单
name: "环境健康检查"
description: "检查工作环境的健康状况（Git、依赖、配置）"
weight: 5

checks:
  - id: git_status
    name: "Git 状态检查"
    prompt: >
      检查当前工作目录的 Git 状态：
      1. 是否有未提交的改动
      2. 是否有未追踪的文件
      3. 当前分支与主分支的差距
      4. 是否有冲突未解决
    severity: warning
    weight: 6

  - id: env_files
    name: "环境变量完整性"
    prompt: >
      检查项目下的 .env 文件是否包含所有必要的环境变量。
      与 .env.example 对比，找出缺失的变量。
      如果 .env.example 不存在，只报告是否有 .env 文件。
    severity: warning
    weight: 5

  - id: temp_files
    name: "临时文件/垃圾清理"
    prompt: >
      检查工作目录中是否有明显的临时文件、缓存文件、日志文件、
      调试输出文件，这些通常会干扰后续操作。
      列出发现。
    severity: info
    weight: 2
