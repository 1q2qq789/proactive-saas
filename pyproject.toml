[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proactive-scanner"
version = "0.2.0"
description = "AI-powered proactive content scanner + intent analysis — finds data quality issues, logic gaps, and gives proactive suggestions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["scanner", "qa", "content-quality", "lint", "review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: General",
]

[project.scripts]
proactive-scan = "proactive_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/1q2qq789/proactive-scanner"
Repository = "https://github.com/1q2qq789/proactive-scanner"
BugTracker = "https://github.com/1q2qq789/proactive-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_scanner"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
